<p>
    Implement a search input that fetches and displays user 
</p>


<div class="container mt-4">
  <h2>Search Users</h2>
  <div class="mb-3">
    <input type="text" class="form-control" placeholder="Type to search..." [formControl]="searchControl">
  </div>
</div>


@if (searchResults.length !== 0) {
    <h3>Search Results:</h3>
    <ul>
        @for (user of searchResults; track user.id) {
            <li>{{ user.name }} - {{ user.email }}</li>
        }
    </ul>
}
